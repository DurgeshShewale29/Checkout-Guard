<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CheckoutGuard AI Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b1120;
            --panel-bg: #111827;
            --text-main: #F3F4F6;
            --text-muted: #9CA3AF;
            --border-color: #1F2937;
            --accent: #38bdf8; /* Cyan */
            --accent-glow: rgba(56, 189, 248, 0.15);
            --gold: #fbbf24;
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
            background-image: radial-gradient(circle at top right, rgba(56, 189, 248, 0.05), transparent 400px);
        }

        h1 {
            margin-top: 0;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        h1::before {
            content: '🛡️';
            font-size: 1.5rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }

        .demo-buttons {
            display: flex;
            gap: 0.75rem;
        }

        button {
            background-color: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 0.35rem 0.75rem;
            border-radius: 4px;
            font-family: 'Inter', system-ui, sans-serif;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            border-color: var(--accent);
            color: var(--accent);
            background-color: var(--accent-glow);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        button.primary-btn {
            background-color: var(--accent);
            color: #000;
            border-color: var(--accent);
            font-weight: 600;
        }
        
        button.primary-btn:hover {
            background-color: #7dd3fc;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }

        button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            box-shadow: none;
            background-color: transparent;
            border-color: var(--border-color);
        }

        .main-content {
            display: flex;
            gap: 1.5rem;
            flex: 1;
            min-height: 0;
        }

        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .left-panel, .right-panel {
            flex: 1;
        }

        .table-container {
            overflow-y: auto;
            flex: 1;
            padding-right: 0.5rem;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4B5563;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            text-align: left;
            padding: 0.75rem 0.5rem;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.85rem;
        }

        th {
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.7rem;
            letter-spacing: 0.5px;
            position: sticky;
            top: 0;
            background-color: var(--panel-bg);
            z-index: 10;
        }

        tr {
            cursor: pointer;
            transition: background-color 0.2s;
        }

        tr:hover {
            background-color: rgba(255,255,255,0.03);
        }

        .status-badge {
            font-size: 0.7rem;
            font-weight: 600;
            display: inline-block;
            padding: 0.15rem 0.5rem;
            border-radius: 9999px;
            background-color: rgba(255,255,255,0.05);
            border: 1px solid transparent;
        }

        .status-success { color: var(--success); border-color: rgba(16, 185, 129, 0.2); background-color: rgba(16, 185, 129, 0.05); }
        .status-escalated { color: var(--error); border-color: rgba(239, 68, 68, 0.2); background-color: rgba(239, 68, 68, 0.05); }
        
        .log-entry {
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border-color);
            border-left: 3px solid var(--accent);
            padding: 1rem;
            margin-bottom: 0.75rem;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
        }

        .log-entry.outcome-success { border-left-color: var(--success); }
        .log-entry.outcome-escalated { border-left-color: var(--error); }

        .log-meta {
            font-size: 0.75rem;
            color: var(--gold);
            margin-bottom: 0.5rem;
            font-family: monospace;
            letter-spacing: -0.2px;
        }

        .log-detail {
            margin: 0.35rem 0;
            font-size: 0.85rem;
            line-height: 1.4;
        }
        
        .log-detail strong {
            color: var(--text-muted);
            font-weight: 500;
        }

        .loader {
            display: none;
            margin-left: 10px;
            font-size: 0.875rem;
            color: var(--accent);
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        .ai-buyer-panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--accent);
            border-radius: 8px;
            padding: 1.25rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.05);
            background-image: linear-gradient(to right, rgba(56, 189, 248, 0.03), transparent);
        }
        
        input[type="text"], select {
            background-color: rgba(0,0,0,0.2);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 0.6rem 0.75rem;
            border-radius: 4px;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s;
        }
        
        input[type="text"]:focus, select:focus {
            border-color: var(--accent);
        }
        
        #aiResponse {
            font-size: 0.85rem; 
            color: var(--text-muted); 
            background: rgba(0,0,0,0.2); 
            padding: 1rem; 
            border: 1px dashed var(--border-color); 
            border-radius: 6px; 
            display: none;
            margin-top: 1rem;
            line-height: 1.5;
        }

    </style>
</head>
<body>

    <div class="header">
        <h1>CheckoutGuard</h1>
        <div class="demo-buttons">
            <button onclick="triggerDemo('missing_consent')">Trigger: Missing Consent</button>
            <button onclick="triggerDemo('token_expired')">Trigger: Expired Token</button>
            <button onclick="triggerDemo('timeout')">Trigger: Timeout</button>
            <button onclick="triggerDemo('decline')">Trigger: Decline</button>
            <button onclick="triggerDemo('subscription_failed')">Trigger: Subscription Failure</button>
            <span id="loader" class="loader">Running Agent Loop...</span>
        </div>
    </div>

    <!-- AI Buyer Panel -->
    <div class="ai-buyer-panel">
        <h2 style="margin-top: 0; font-size: 1.1rem; font-weight: 600; color: #fff;">Autonomous AI Buyer</h2>
        <div style="display: flex; gap: 0.75rem;">
            <input type="text" id="aiIntentInput" placeholder="Tell the AI Buyer what to purchase... e.g. 'buy a birthday gift for my sister'" style="flex: 1;">
            <select id="aiScenarioSelect">
                <option value="success">Scenario: Success</option>
                <option value="missing_consent">Scenario: Missing Consent</option>
                <option value="token_expired">Scenario: Expired Token</option>
                <option value="timeout">Scenario: Timeout</option>
                <option value="decline">Scenario: Decline</option>
            </select>
            <button class="primary-btn" onclick="triggerAIBuyer()">Execute Purchase</button>
        </div>
        <div id="aiResponse"></div>
    </div>

    <div class="main-content">
        <!-- Left Panel: Transaction List -->
        <div class="panel left-panel">
            <div style="margin-bottom: 1.25rem; display: flex; justify-content: space-between; align-items: baseline;">
                <h2 style="margin: 0; font-size: 1.1rem; color: #fff;">Transaction Monitor</h2>
                <div id="metrics" style="font-size: 0.8rem; color: var(--text-muted); font-weight: 500;"></div>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Initial Failure</th>
                            <th>Final Outcome</th>
                        </tr>
                    </thead>
                    <tbody id="transactionList">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Right Panel: Audit Trail -->
        <div class="panel right-panel">
            <h2 style="margin: 0 0 1.25rem 0; font-size: 1.1rem; color: #fff;">Audit Trail & Resolution</h2>
            <div id="auditDetail" class="table-container" style="padding-right: 10px;">
                <p style="color: var(--text-muted);">Select a transaction to view its full chronological audit trail.</p>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api/dashboard';

        async function fetchTransactions() {
            try {
                const res = await fetch(`${API_BASE}/transactions`);
                const data = await res.json();
                renderTable(data);
                renderMetrics(data);
            } catch (err) {
                console.error("Failed to fetch transactions", err);
            }
        }

        function renderMetrics(transactions) {
            const metricsDiv = document.getElementById('metrics');
            if (!transactions || transactions.length === 0) {
                metricsDiv.innerHTML = '0% Recovered / 0% Escalated';
                return;
            }
            
            // Only count transactions that had an initial failure (needed recovery)
            const failedTxs = transactions.filter(tx => tx.initial_failure);
            if (failedTxs.length === 0) {
                metricsDiv.innerHTML = 'No failures recorded yet';
                return;
            }
            
            const recovered = failedTxs.filter(tx => tx.final_outcome === 'success').length;
            const escalated = failedTxs.filter(tx => tx.final_outcome === 'escalated').length;
            const total = failedTxs.length;
            
            const recPct = Math.round((recovered / total) * 100);
            const escPct = Math.round((escalated / total) * 100);
            
            metricsDiv.innerHTML = `<span style="color: var(--success); font-weight: 600;">${recPct}% Auto-Recovered</span> <span style="margin: 0 0.5rem;">|</span> <span style="color: var(--error)">${escPct}% Escalated</span>`;
        }

        function renderTable(transactions) {
            const tbody = document.getElementById('transactionList');
            tbody.innerHTML = '';
            
            transactions.forEach(tx => {
                const tr = document.createElement('tr');
                tr.onclick = () => fetchDetail(tx.transaction_id);
                
                const badgeClass = tx.final_outcome === 'success' ? 'status-success' : 'status-escalated';
                const initial = tx.initial_failure || 'None';
                
                tr.innerHTML = `
                    <td style="font-family: 'IBM Plex Mono', monospace;">${tx.transaction_id}</td>
                    <td>${initial}</td>
                    <td><span class="status-badge ${badgeClass}">${tx.final_outcome.toUpperCase()}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function fetchDetail(txId) {
            try {
                const res = await fetch(`${API_BASE}/transactions/${txId}`);
                const trail = await res.json();
                renderDetail(txId, trail);
            } catch (err) {
                console.error("Failed to fetch details", err);
            }
        }

        function renderDetail(txId, trail) {
            const detailDiv = document.getElementById('auditDetail');
            detailDiv.innerHTML = `<div style="margin-bottom:1rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border-color);"><span style="color:var(--text-muted); font-size:0.75rem;">TRANSACTION ID</span><br><strong style="font-family:monospace; font-size:1.1rem; color: #fff;">${txId}</strong></div>`;
            
            trail.forEach(record => {
                const outcomeClass = record.outcome === 'success' ? 'outcome-success' : 
                                     (record.outcome === 'escalated' ? 'outcome-escalated' : '');
                
                const html = `
                    <div class="log-entry ${outcomeClass}">
                        <div class="log-meta">${record.timestamp} | Attempt ${record.attempt_number}</div>
                        <div class="log-detail"><strong>Failure Type:</strong> ${record.failure_type || 'None'}</div>
                        <div class="log-detail"><strong>Action Taken:</strong> ${record.action_taken}</div>
                        <div class="log-detail"><strong>Outcome:</strong> <span style="text-transform:uppercase;">${record.outcome}</span></div>
                        <div class="log-detail"><strong>Reasoning:</strong> ${record.reasoning}</div>
                        ${record.confidence_score ? `<div class="log-detail"><strong>Confidence:</strong> ${(record.confidence_score * 100).toFixed(1)}%</div>` : ''}
                    </div>
                `;
                detailDiv.innerHTML += html;
            });
        }

        async function triggerDemo(scenario) {
            const loader = document.getElementById('loader');
            const btns = document.querySelectorAll('button');
            
            loader.style.display = 'inline-block';
            btns.forEach(b => b.disabled = true);
            
            try {
                await fetch(`${API_BASE}/trigger?scenario=${scenario}`, { method: 'POST' });
                // Re-fetch table to show new entry
                await fetchTransactions();
            } catch (err) {
                alert("Failed to trigger demo.");
            } finally {
                loader.style.display = 'none';
                btns.forEach(b => b.disabled = false);
            }
        }

        async function triggerAIBuyer() {
            const input = document.getElementById('aiIntentInput').value;
            const scenario = document.getElementById('aiScenarioSelect').value;
            if (!input) {
                alert("Please enter a buying intent.");
                return;
            }

            const loader = document.getElementById('loader');
            const btns = document.querySelectorAll('button');
            const respDiv = document.getElementById('aiResponse');
            
            loader.style.display = 'inline-block';
            btns.forEach(b => b.disabled = true);
            respDiv.style.display = 'block';
            respDiv.innerHTML = '<i>Agent is deciding...</i>';
            
            try {
                const res = await fetch(`${API_BASE}/trigger_ai_buyer`, { 
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ intent: input, scenario: scenario })
                });
                const data = await res.json();
                
                if (data.status === 'error') {
                    respDiv.innerHTML = `<span style="color:var(--error)">${data.reason}</span>`;
                } else {
                    respDiv.innerHTML = `
                        <strong style="color:var(--accent);">Selected:</strong> <span style="color:#fff;">${data.product.name} (₹${data.product.price_inr})</span><br>
                        <strong style="color:var(--accent);">Reasoning:</strong> <span style="color:var(--text-main);">${data.reasoning}</span><br>
                        <strong style="color:var(--accent);">Order ID:</strong> <span style="font-family: monospace; color:#fff;">${data.order_id}</span> <span style="color:var(--text-muted); font-style:italic;">(Processing through CheckoutGuard via simulated '${scenario}'...)</span>
                    `;
                }
                
                // Refresh the table to show the new transaction flowing through CheckoutGuard
                await fetchTransactions();
            } catch (err) {
                respDiv.innerHTML = `<span style="color:var(--error)">Failed to trigger AI Buyer. Check server logs.</span>`;
            } finally {
                loader.style.display = 'none';
                btns.forEach(b => b.disabled = false);
            }
        }

        // Initial Load
        fetchTransactions();
    </script>
</body>
</html>
