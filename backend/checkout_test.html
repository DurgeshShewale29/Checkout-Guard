<!DOCTYPE html>
<html>
<head>
    <title>Razorpay Test Checkout</title>
</head>
<body>
    <button id="rzp-button1">Pay</button>
    <div id="status"></div>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
        // Parameters passed in URL: ?key_id=...&order_id=...&amount=...
        const urlParams = new URLSearchParams(window.location.search);
        const key_id = urlParams.get('key_id');
        const order_id = urlParams.get('order_id');
        const amount = urlParams.get('amount');

        var options = {
            "key": key_id,
            "amount": amount,
            "currency": "INR",
            "name": "CheckoutGuard Test",
            "description": "Test Transaction",
            "order_id": order_id,
            "handler": function (response){
                document.getElementById('status').innerText = 'Verifying payment with backend...';
                
                fetch('http://127.0.0.1:8000/api/payments/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        razorpay_order_id: response.razorpay_order_id,
                        razorpay_payment_id: response.razorpay_payment_id,
                        razorpay_signature: response.razorpay_signature
                    })
                })
                .then(res => res.json())
                .then(data => {
                    document.getElementById('status').innerHTML = '✅ <b>SUCCESS:</b> Payment ' + data.payment_id + ' verified & logged by CheckoutGuard!';
                })
                .catch(err => {
                    document.getElementById('status').innerHTML = '❌ <b>VERIFICATION FAILED:</b> ' + err;
                });
            },
            "prefill": {
                "name": "Test User",
                "email": "test@example.com",
                "contact": "9999999999"
            },
            "theme": {
                "color": "#3399cc"
            }
        };
        var rzp1 = new Razorpay(options);
        rzp1.on('payment.failed', function (response){
                document.getElementById('status').innerText = 'FAILED:' + 
                    response.error.code + ':' + 
                    response.error.description;
        });
        document.getElementById('rzp-button1').onclick = function(e){
            rzp1.open();
            e.preventDefault();
        }
    </script>
</body>
</html>
