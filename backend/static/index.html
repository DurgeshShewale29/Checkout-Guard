<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CheckoutGuard AI Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --accent: #3b82f6;
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            margin-top: 0;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .demo-buttons {
            display: flex;
            gap: 1rem;
        }

        button {
            background-color: var(--panel-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 0.75rem 1.25rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            border-color: var(--accent);
            background-color: rgba(59, 130, 246, 0.1);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .main-content {
            display: flex;
            gap: 2rem;
            flex: 1;
            min-height: 0;
        }

        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .left-panel {
            flex: 1;
        }

        .right-panel {
            flex: 1;
        }

        .table-container {
            overflow-y: auto;
            flex: 1;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            text-align: left;
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            color: var(--text-muted);
            font-weight: 500;
            position: sticky;
            top: 0;
            background-color: var(--panel-bg);
        }

        tr {
            cursor: pointer;
            transition: background-color 0.2s;
        }

        tr:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-size: 0.875rem;
            font-weight: 600;
            display: inline-block;
        }

        .status-success { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .status-escalated { background: rgba(239, 68, 68, 0.2); color: var(--error); }
        
        .log-entry {
            background: rgba(0,0,0,0.2);
            border-left: 4px solid var(--accent);
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 0 8px 8px 0;
        }

        .log-entry.outcome-success { border-left-color: var(--success); }
        .log-entry.outcome-escalated { border-left-color: var(--error); }

        .log-meta {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .log-detail {
            margin: 0.25rem 0;
        }

        .loader {
            display: none;
            margin-left: 10px;
            font-size: 0.875rem;
            color: var(--accent);
        }

    </style>
</head>
<body>

    <div class="header">
        <h1>CheckoutGuard Audit Dashboard</h1>
        <div class="demo-buttons">
            <button onclick="triggerDemo('missing_consent')">Trigger: Missing Consent</button>
            <button onclick="triggerDemo('token_expired')">Trigger: Expired Token</button>
            <button onclick="triggerDemo('timeout')">Trigger: Timeout</button>
            <button onclick="triggerDemo('decline')">Trigger: Decline</button>
            <span id="loader" class="loader">Running Agent Loop...</span>
        </div>
    </div>

    <div class="main-content">
        <!-- Left Panel: Transaction List -->
        <div class="panel left-panel">
            <h2>Transactions</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Initial Failure</th>
                            <th>Final Outcome</th>
                        </tr>
                    </thead>
                    <tbody id="transactionList">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Right Panel: Audit Trail -->
        <div class="panel right-panel">
            <h2>Audit Trail Detail</h2>
            <div id="auditDetail" class="table-container" style="padding-right: 10px;">
                <p style="color: var(--text-muted);">Select a transaction to view its full chronological audit trail.</p>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api/dashboard';

        async function fetchTransactions() {
            try {
                const res = await fetch(`${API_BASE}/transactions`);
                const data = await res.json();
                renderTable(data);
            } catch (err) {
                console.error("Failed to fetch transactions", err);
            }
        }

        function renderTable(transactions) {
            const tbody = document.getElementById('transactionList');
            tbody.innerHTML = '';
            
            transactions.forEach(tx => {
                const tr = document.createElement('tr');
                tr.onclick = () => fetchDetail(tx.transaction_id);
                
                const badgeClass = tx.final_outcome === 'success' ? 'status-success' : 'status-escalated';
                const initial = tx.initial_failure || 'None';
                
                tr.innerHTML = `
                    <td style="font-family: monospace;">${tx.transaction_id}</td>
                    <td>${initial}</td>
                    <td><span class="status-badge ${badgeClass}">${tx.final_outcome.toUpperCase()}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function fetchDetail(txId) {
            try {
                const res = await fetch(`${API_BASE}/transactions/${txId}`);
                const trail = await res.json();
                renderDetail(txId, trail);
            } catch (err) {
                console.error("Failed to fetch details", err);
            }
        }

        function renderDetail(txId, trail) {
            const detailDiv = document.getElementById('auditDetail');
            detailDiv.innerHTML = `<h3 style="margin-top:0; font-family:monospace;">${txId}</h3>`;
            
            trail.forEach(record => {
                const outcomeClass = record.outcome === 'success' ? 'outcome-success' : 
                                     (record.outcome === 'escalated' ? 'outcome-escalated' : '');
                
                const html = `
                    <div class="log-entry ${outcomeClass}">
                        <div class="log-meta">${record.timestamp} | Attempt ${record.attempt_number}</div>
                        <div class="log-detail"><strong>Failure Type:</strong> ${record.failure_type || 'None'}</div>
                        <div class="log-detail"><strong>Action Taken:</strong> ${record.action_taken}</div>
                        <div class="log-detail"><strong>Outcome:</strong> <span style="text-transform:uppercase;">${record.outcome}</span></div>
                        <div class="log-detail"><strong>Reasoning:</strong> ${record.reasoning}</div>
                    </div>
                `;
                detailDiv.innerHTML += html;
            });
        }

        async function triggerDemo(scenario) {
            const loader = document.getElementById('loader');
            const btns = document.querySelectorAll('button');
            
            loader.style.display = 'inline-block';
            btns.forEach(b => b.disabled = true);
            
            try {
                await fetch(`${API_BASE}/trigger?scenario=${scenario}`, { method: 'POST' });
                // Re-fetch table to show new entry
                await fetchTransactions();
            } catch (err) {
                alert("Failed to trigger demo.");
            } finally {
                loader.style.display = 'none';
                btns.forEach(b => b.disabled = false);
            }
        }

        // Initial Load
        fetchTransactions();
    </script>
</body>
</html>
